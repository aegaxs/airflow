airflowLocalSettings: |
  from airflow.providers.cncf.kubernetes.utils.xcom_sidecar import PodDefaults
  from kubernetes.client import models as k8s
  XCOM_MOUNT_PATH = '/airflow/xcom'
  SIDECAR_CONTAINER_NAME = 'airflow-xcom-sidecar'
  XCOM_CMD = 'trap "exit 0" INT; while true; do sleep 60; done;'
  VOLUME_MOUNT = k8s.V1VolumeMount(name='xcom', mount_path=XCOM_MOUNT_PATH)
  VOLUME = k8s.V1Volume(name='xcom', empty_dir=k8s.V1EmptyDirVolumeSource())
  PodDefaults.SIDECAR_CONTAINER.image = '971217900852.dkr.ecr.us-west-2.amazonaws.com/data/k8s-sidecar:1.2.0'

  PodDefaults.SIDECAR_CONTAINER = k8s.V1Container(
    name=SIDECAR_CONTAINER_NAME,
    command=['sh', '-c', XCOM_CMD],
    image='971217900852.dkr.ecr.us-west-2.amazonaws.com/data/k8s-sidecar:1.2.0',
    volume_mounts=[VOLUME_MOUNT],
    resources=k8s.V1ResourceRequirements(
      requests={"cpu": "200m","memory":"200Mi"},
      limits={"cpu": "0.5","memory":"200Mi"}
      ),
    )

